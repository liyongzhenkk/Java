spring.application.name=springMVC
spring.config.import=optional:file:./application-local.properties

app.port=8888

# 数据库连接配置
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sys_user?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai}
# 你的数据库用户名
spring.datasource.username=${DB_USERNAME:root}
# 你的数据库密码
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
# 驼峰命名转换（role_id → roleId）
mybatis.configuration.map-underscore-to-camel-case=true
# 实体类所在包（替换为你的实际包名）
mybatis.type-aliases-package=com.lyzstack.springmvc.entities
# 指定Mapper XML文件位置
mybatis.mapper-locations=classpath:mapper/*.xml
